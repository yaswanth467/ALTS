<!DOCTYPE html>
<html>
    <title>Candidate information</title>
    <body style="background-color:lightblue;">
  
    <form>
        <table border="5px" >
            <tr>
            <td>Name:*</td>
            <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password*:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Phone number:*</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Gender:*</td>
                <td><input type="radio" name="gender">male<br> <input type="radio" name="gender">female</td>

            </tr>
            <tr>
                <td><label>Date of birth:*</label></td>
                <td><input type="textbox" placeholder="MM/DD/YYYY"></td>
            </tr>
            <tr>
                <td>Email:*</td>
                <td><input type="textbox"></td>
            </tr>
            <tr>
                <td>Highest Qualification:*</td>
                <td><select>
                    <option>SELECT HIGHER QUALICATION</option>
                    <option>SSC</option>
                    <option>INTERMEDIATE</option>
                    <option>BTECH</option>
                 </select></td>
            </tr>
            <tr>
                <td>Courses Intrested:*</td>
                <td><input type="checkbox">JAVA
                <input type="checkbox">PYTHON
                <input type="checkbox">HTML
                <input type="checkbox">CSS
            </td>
            </tr>
            <tr>
                <td>Comments:(Mention Externals if any)</td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td>Upload Degree/External Certificates:*</td>
                <td><button>choose file</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
